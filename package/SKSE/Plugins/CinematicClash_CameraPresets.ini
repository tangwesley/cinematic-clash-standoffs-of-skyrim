; Cinematic Clash - camera presets
;
; Each [section] below is a named camera preset. List the ones you want in
;     [Camera] sPreset = Name1, Name2, ...
; in CinematicClash.ini: every clash draws one of them at random, skipping any
; whose camera position is walled off (fWallMargin), and uses the first listed
; when all of them are. A single name always uses that shot; empty uses the
; [Camera] keys as written.
;
; A preset may contain any of these keys, with the same meaning as in [Camera]:
;     fOffsetX fOffsetY fOffsetZ   camera position from the player's feet, in the
;                                  player's own frame: X right, Y forward, Z up
;     bAimAtContact fAimHeight     look at the point where the weapons meet
;     fYawDegrees fPitchDegrees    nudges on that aim (yaw + = right, pitch + = down)
;     fFOV                         field of view for the clash (0 = leave alone)
;     fBlendIn fBlendOut           seconds to move into the shot and back out
; Keys a preset leaves out keep the value from [Camera] in CinematicClash.ini.
;
; Geometry to keep in mind while tuning: the two actors stand fClashDistance
; apart (55 by default), so the contact point is ~27 units in front of the
; player and the opponent stands at Y = 55. Actor heads are around Z = 120.
;
; Both files are re-read whenever they change on disk, so you can switch
; presets and tweak values while the game runs; the next clash uses them.

; Your settings as of 14 Sep 2026: a low three-quarter view from the player's
; right, waist height, looking slightly up at the locked weapons.
[LowSide]
fOffsetX = 90
fOffsetY = -20
fOffsetZ = 60
bAimAtContact = 1
fAimHeight = 90
fYawDegrees = 0
fPitchDegrees = 0
fFOV = 75
fBlendIn = 0.3
fBlendOut = 0.4

; The God of War (2018) signature: tucked in tight over the player's right
; shoulder, a touch above head height, looking down across the crossed blades
; at the opponent's face. The player's shoulder and the back of their head fill
; the left edge of the frame.
[TightShoulder]
fOffsetX = 35
fOffsetY = -40
fOffsetZ = 115
bAimAtContact = 1
fAimHeight = 95
fYawDegrees = 0
fPitchDegrees = 0
fFOV = 60
fBlendIn = 0.25
fBlendOut = 0.4

; Straight side-on, level with the weapons: both fighters in profile, waist up,
; blades crossing dead centre. Longer lens for a flatter, more "staged" look.
[Profile]
fOffsetX = 105
fOffsetY = 27
fOffsetZ = 100
bAimAtContact = 1
fAimHeight = 95
fYawDegrees = 0
fPitchDegrees = 0
fFOV = 55
fBlendIn = 0.3
fBlendOut = 0.4

; Hero angle: camera down near the ground off the player's right hip, looking
; up about 30 degrees at the weapons with both heads above them against the sky.
[LowHero]
fOffsetX = 75
fOffsetY = -5
fOffsetZ = 45
bAimAtContact = 1
fAimHeight = 95
fYawDegrees = 0
fPitchDegrees = 0
fFOV = 65
fBlendIn = 0.3
fBlendOut = 0.4

; Reverse angle: over the opponent's shoulder looking back at the player's face
; behind the locked weapons (the shot God of War cuts to when Kratos strains).
; The camera swings around the pair to get there, so the blend is kept short.
[ReverseShoulder]
fOffsetX = -35
fOffsetY = 95
fOffsetZ = 115
bAimAtContact = 1
fAimHeight = 95
fYawDegrees = 0
fPitchDegrees = 0
fFOV = 60
fBlendIn = 0.15
fBlendOut = 0.4
