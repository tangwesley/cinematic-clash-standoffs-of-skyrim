; Cinematic Clash - configuration
; Every value below is optional; missing keys fall back to the defaults shown.

[General]
; Master switch.
bEnabled = 1
; Percent chance that a detected weapon clash turns into a cinematic standoff.
fTriggerChance = 100
; Minimum seconds between two standoffs.
fCooldownSeconds = 1
; Only clash with NPCs that are hostile to the player.
bRequireHostile = 0
; A standoff will not start if the two actors are further apart than this (units).
fMaxStartDistance = 1000

[Standoff]
; Seconds the quick time event lasts. Reaching the end without either side pushed off the
; meter is a draw (see [Outcome] fDrawStaggerMagnitude).
fDuration = 5.0
; Meter gained per attack press (meter runs 0..1, starts at 0.5). How hard the opponent
; pushes back is set in [Difficulty] below, in presses per second.
fPressGain = 0.09
; Low player stamina weakens each press (down to 50% at empty).
bStaminaAffectsPlayer = 1
; Low NPC stamina weakens its push (down to 50% at empty).
bStaminaAffectsNpc = 1
; Player stamina spent per press.
fStaminaCostPerPress = 3
; Distance between the two actors while locked together (units).
fClashDistance = 55
; How far the pair slides along the clash axis as the meter swings (units at meter 0 or 1).
; The slide repositions both actors every frame, which the movement system can read as
; motion (walk blend, turning); the meter on screen shows the balance regardless. 0 = off.
fPushDistance = 0
; Seconds to slide both actors into position.
fApproachTime = 0.25
; Seconds after the clash begins during which the actors keep being turned to face each
; other. After that their headings freeze and head/spine tracking is switched off, so
; nothing twists the upper body underneath the block for the rest of the standoff.
fSettleTime = 0.5
; Optional: once settled and both actors are in the block, stop the opponent's animation graph so
; they hold the pose dead still until the resolve (the player keeps animating; their graph is
; not driven by the hook this uses). Off by default: idle motion reads better. 1 = freeze.
bFreezeAfterSettle = 0
; While locked, the two actors stop colliding with each other (their character controllers
; otherwise push each other apart at close range, which the animation graph reads as walking
; and turning). With Precision installed only that pair is affected; without it the opponent's
; collision is switched off for the duration.
bDisableCollision = 1
; Global time multiplier during the standoff (0.1 .. 1). 1 = no slow motion.
fTimeMultiplier = 1.0
; Shields during a clash: 0 = leave alone, 1 = hide the shield model for the duration.
; Which block animation plays is handled by Open Animation Replacer: the shipped
; "Shield To Weapon Block" replacer folder swaps the shield block for the one-handed weapon
; block while the clash runs, so with OAR installed a shield user blocks with their sword.
iShieldMode = 1
; Small camera shake on every press for feedback.
bShakeOnPress = 1
fShakeStrength = 0.12

[Difficulty]
; How hard the opponent pushes back, stated as the number of attack presses per second that
; exactly holds the meter still against an opponent of equal weapon skill. Press faster than
; that and the meter climbs to your end, slower and it falls to theirs; matching it exactly
; keeps the centre until the timer runs out, which is a draw. 0 = easy, 1 = normal, 2 = hard.
iMode = 1
fEasyPressesPerSecond = 3
fNormalPressesPerSecond = 4
fHardPressesPerSecond = 5
; The two governing weapon skills (One-Handed or Two-Handed, whichever each weapon uses,
; buffs included) scale the push: a better-skilled opponent pushes harder, a worse one
; softer. 0 = ignore skills, 1 = up to +/-100% at the extremes.
fSkillInfluence = 0.8
; An opponent whose weapon skill is at least this many points below yours never gets a
; standoff: the clash resolves on the spot and they take the loser's stagger. The reverse
; never applies; a far better opponent still has to be beaten in the standoff. 0 = off.
fAutoWinSkillGap = 15
; Accessibility: hold the attack button instead of mashing it. Held time counts as presses
; at the chosen difficulty's rate (3, 4 or 5 per second), so a held button exactly matches an
; equal opponent and the skill gap decides. Separate presses are ignored in this mode.
bHoldToMash = 0

[Rumble]
; Controller rumble while the weapons are locked (XInput pads, including anything Steam
; Input presents as one). Motor levels are 0..1.
bEnabled = 1
; Level held on the large (low-frequency) and small (high-frequency) motors for the standoff.
fLargeMotor = 0.45
fSmallMotor = 0.2
; Extra kick on the small motor for every counted press, and how long it lasts. 0 = off.
fPressPulse = 0.7
fPulseDuration = 0.08
; Stay silent when the game's own controller rumble is switched off in its settings.
bRespectGameSetting = 1

[Camera]
; Move the camera behind the player's shoulder for the standoff.
bEnabled = 1
; Camera position relative to the player, in the player's own frame and scaled by their size.
; X = right (negative = left), Y = forward (negative = behind), Z = up from the feet.
; This file is re-read whenever it changes, so these can be tuned while the game runs.
fOffsetX = 90
fOffsetY = -20
fOffsetZ = 60
; Aim the camera at the point where the weapons meet, so any position above frames the
; fight without hand-tuning angles. fAimHeight is that point's height above the ground.
bAimAtContact = 1
fAimHeight = 90
; Aim adjustments in degrees: yaw left/right (positive = right), pitch up/down (positive =
; tilts down). With bAimAtContact on these nudge the aim; with it off they are the whole aim,
; relative to the player's heading and look pitch.
fYawDegrees = 0
fPitchDegrees = 0
; World field of view during the clash, blended in and out with the camera and restored
; exactly afterwards (SmoothCam zoom and FOV mods get their value back). 0 = leave FOV alone.
fFOV = 75
; Seconds to blend from the current camera position into the shoulder shot.
fBlendIn = 0.3
; Seconds to blend back to the normal camera when the clash ends.
fBlendOut = 0.4
; If the clash started in first person, go back to first person afterwards.
bRestoreFirstPerson = 1
fFirstPersonRestoreDelay = 0.75
; Camera presets: a comma-separated list of section names from
; SKSE/Plugins/CinematicClash_CameraPresets.ini. Every clash picks one of them at random;
; a preset whose camera position is walled off from the fight (see fWallMargin) is skipped
; and another is drawn, and when every listed preset is walled off the first one is used.
; Each preset overrides the framing keys above (offsets, aim, angles, FOV, blend times);
; keys a preset leaves out keep the values written here. One name = always that shot.
; Empty = use the keys above as written.
sPreset = LowSide, TightShoulder, Profile, LowHero, ReverseShoulder
; Clearance a shot needs: a ray from the point where the weapons meet to the camera,
; extended by this many units, must not hit anything but the two fighters. Presets that
; fail the check are skipped for that clash. 0 = never check.
fWallMargin = 15

[Sparks]
; Continuous sparks at the point of contact while the weapons are locked.
bEnabled = 1
; Seconds between bursts.
fInterval = 0.08
; Height of the contact point above the ground, scaled by the player's size.
fHeight = 105
; Size of each burst.
fScale = 1.0
; Random offset per burst in units, so the shower moves around a little.
fJitter = 6
; Optional .nif path (relative to Data\meshes) to use instead of the weapon's own
; block-impact spark model, e.g. effects\impacteffects\impactmetalsparks01.nif
sModel = 

[Audio]
; Each sound is either a sound descriptor editor ID (played through the game's audio
; system, positioned in 3D) or a loose .wav path relative to Data, e.g.
; Sound\FX\CinematicClash\impact.wav (played on the plugin's own XAudio2 voices: 2D, follows
; the master volume slider, loops gaplessly, pauses with the menu). WAV files: PCM 16-bit,
; 44.1 kHz, mono or stereo. Leave a sound empty to use the weapon's own block-impact sounds.
bEnabled = 1
; One shot when the weapons lock.
sImpactSound = Sound\FX\CinematicClash\impact.wav
fImpactVolume = 0.12
; Kept going at the contact point for the whole standoff. A looping descriptor plays once;
; a one-shot descriptor (the default weapon scrape) is re-triggered every fLoopInterval seconds.
sLoopSound = Sound\FX\CinematicClash\grind.wav
fLoopInterval = 5.4
fLoopVolume = 0.12
; One shot when the standoff resolves.
sOverpowerSound = Sound\FX\CinematicClash\overpower.wav
fOverpowerVolume = 0.12
; The opponent shouts a combat taunt in their own voice when the clash starts, through the
; dialogue system. sShoutTopic picks a specific dialogue topic by editor ID (empty = the
; generic combat taunt); sShoutSound plays a sound descriptor instead of a voice line.
bEnemyShout = 1
sShoutTopic = 
sShoutSound = 

[HUD]
; Draw the tug-of-war meter at the bottom centre of the screen during a standoff.
; Your share fills from the left, the opponent's from the right; the marker is the current balance and
; the thin line underneath is the time left.
bEnabled = 1
; Size multiplier for the meter and its text.
fScale = 1.0
; Vertical position of the bar: 0 = top of the screen, 1 = bottom.
fVerticalPosition = 0.86
; Optional PNG skin. Folder under Data; any of frame.png, fill_player.png,
; fill_opponent.png, marker.png, timer.png found there replaces the drawn version of that
; element, and key_<LABEL>.png (key_RT.png, key_LMB.png, key_E.png ...) replaces the
; drawn attack-button glyph for that binding. Missing files keep the built-in drawing.
; File sizes and layout are described in README.txt inside the folder. Saving this INI
; reloads the skin while the game is running.
sTextureFolder = SKSE/Plugins/CinematicClash/HUD
; The pixel grid the skin was drawn on: a PNG this many pixels wide is shown as wide as
; the bar (32% of the screen, times fScale). Every skin PNG is drawn at that same
; pixel ratio, so draw them all on one grid.
iTextureGridWidth = 1024
; Font for the names and the glyph lettering. Empty = the same font the game's own UI
; uses: Interface\fontconfig.txt is read (font replacer mods included) and the face
; mapped to sGameFont is taken from its fontlib SWF. Set a .ttf path relative to Data
; (for example Interface\Fonts\MyFont.ttf) to use that file instead.
sFontFile =
; Which fontconfig.txt mapping to follow when sFontFile is empty. $EverywhereFont is the
; general HUD face; $EverywhereBoldFont, $StartMenuFont and $DialogueFont are the others.
sGameFont = $EverywhereFont

[Outcome]
; Stagger magnitude sent to the loser (1.0 = the large stagger, 0 = none).
fLoserStaggerMagnitude = 1.0
; Stagger magnitude sent to the winner (0 = none).
fWinnerStaggerMagnitude = 0
; When the timer runs out with neither side pushed off the meter, the clash is a draw
; wherever the marker sits: both actors take this stagger instead (0.25 = the small
; stagger, 0 = none). Neither counts as winner or loser for the OAR conditions.
fDrawStaggerMagnitude = 0.25
; Seconds the CinematicClash_IsClashWinner / _IsClashLoser OAR conditions stay true.
fOutcomeWindow = 1.0

[Messages]
; Master switch for the HUD notifications below. 0 = show none of them.
bEnabled = 1
; Leave a single value empty to show nothing for that event.
sStart = Weapon clash! Mash attack!
; Shown instead of sStart when [Difficulty] bHoldToMash is on.
sStartHold = Weapon clash! Hold attack!
; Shown when the opponent is skipped past the standoff by fAutoWinSkillGap.
sAutoWin = Your skill breaks through their guard!
sWin = You overpowered your opponent!
sLose = You were overpowered!
; Shown when the timer runs out and both break off.
sDraw = Neither of you gives way!
; Sound descriptor editor ID played on every press (e.g. WPNBlockWeaponBlade). Empty = none.
sPressSound = 

[Debug]
; Verbose logging to Documents\My Games\Skyrim Special Edition\SKSE\CinematicClash.log
bDebugLog = 1
; Testing aid: every melee hit the player lands on a humanoid NPC starts a clash,
; skipping the weapon-parry check, bRequireHostile and fTriggerChance. Cooldown still applies.
; Leave at 0 for normal play.
bForceClashOnHit = 1
